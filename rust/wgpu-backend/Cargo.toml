[package]
name = "wgpu-backend"
version = "0.1.0"
edition = "2021"
description = "Wayland + wgpu graphical backend for Emacs (FFI staticlib)."
license = "GPL-3.0-or-later"
publish = false

[lib]
# staticlib -> libwgpu_backend.a linked into the emacs binary.
# rlib      -> lets examples/tests/benches drive the crate as a Rust library
#              (e.g. examples/clear_color.rs for standalone window bring-up).
name = "wgpu_backend"
crate-type = ["staticlib", "rlib"]

[dependencies]
# GPU rendering.
wgpu = "24"
pollster = "0.4"            # block_on for wgpu's async device/adapter requests
raw-window-handle = "0.6"   # hand Wayland handles to wgpu's surface creation
# Raw Wayland client (window, xdg-shell, input).
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# Force the system libwayland backend so we can hand the real wl_display /
# wl_surface C pointers to wgpu's Vulkan surface creation (as winit does).
wayland-backend = { version = "0.3", features = ["client_system"] }
png = "0.17"               # encode offscreen frames for golden-image tests
bytemuck = { version = "1", features = ["derive"] }  # vertex POD casts
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
