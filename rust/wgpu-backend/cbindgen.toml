# cbindgen config for the wgpu Emacs backend.
# Generates src/wgpu_ffi.h (run from the crate dir, see Makefile/README).
language = "C"
include_guard = "EMACS_WGPU_FFI_H"
autogen_warning = "/* Generated by cbindgen from rust/wgpu-backend. DO NOT EDIT. */"
cpp_compat = true
style = "type"
tab_width = 2

[parse]
parse_deps = false

[enum]
prefix_with_name = true

[export]
prefix = ""
