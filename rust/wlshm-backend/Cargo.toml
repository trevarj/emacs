[package]
name = "wlshm-backend"
version = "0.1.0"
edition = "2021"
# NOTE: "wlshm" is now a historical name.  This backend pivoted to CPU/software
# rendering: Emacs draws with Cairo onto a persistent canvas and we present it
# through a wl_shm double buffer.  No GPU/Vulkan/wlshm crate is used anymore.
description = "Raw Wayland + CPU (Cairo-on-wl_shm) graphical backend for Emacs (FFI staticlib)."
license = "GPL-3.0-or-later"
publish = false

[lib]
# staticlib -> libwlshm_backend.a linked into the emacs binary.
# rlib      -> lets tests/benches drive the crate as a Rust library.
name = "wlshm_backend"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Raw Wayland client (window, xdg-shell, input, wl_shm pool).
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# text-input-v3 (IME) lives in the unstable protocols.  sctk 0.19 already pulls
# wayland-protocols 0.32 in transitively but doesn't wrap text-input, so we bind
# zwp_text_input_manager_v3 / zwp_text_input_v3 ourselves via raw Dispatch impls.
# The "unstable" feature gates the text_input module; "client" generates the
# client-side proxies.  "staging" gates wp_fractional_scale_v1 (HiDPI fractional
# scaling); wp_viewporter is in the always-on stable set.
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
# Force the system libwayland backend (matches the libwayland-client we link).
wayland-backend = { version = "0.3", features = ["client_system"] }
libc = "0.2"               # timerfd for client-side key repeat

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# This crate is a staticlib linked into Emacs; a panic must not unwind across
# the extern "C" FFI boundary into C.  Abort instead so a panic is a clean,
# defined process termination rather than relying on the per-target unwind
# guard.  (Only affects release; the test profile keeps unwinding.)
panic = "abort"
